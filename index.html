<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédex Art Card Index</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">

<meta name="description" content="Every illustration rare, special illustration rare and special-art card for every Pokémon from #001 to #1025, from English Pokémon TCG sets, 2006–2026.">
<script>try{var t=JSON.parse(localStorage.getItem('kanto-art-card-index:v1')||'{}').theme;if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a Pokédex index rail on the left; the selected Pokémon's cards sit in sleeved binder pockets on the right.
   Favorites open as a ring binder: nine-pocket pages, two to a spread. */
:root {
  --paper: #ECEFF4;
  --sheet: #FFFFFF;
  --sheet-2: #F3F5F9;
  --ink: #131A2B;
  --muted: #586276;
  --line: #D4DAE5;
  --dex: #C8102E;
  --accent: #2350B5;
  --gold: #9C6A00;
  --heart: #D6264F;
  --ok: #1B7F4B;
  --pocket: #E1E6EE;
  --gloss: rgba(255, 255, 255, .75);
  --scrim: rgba(12, 17, 29, .72);
  --shadow-card: 0 1px 1px rgba(19, 26, 43, .10), 0 6px 16px -6px rgba(19, 26, 43, .30);
  --shadow-lift: 0 2px 4px rgba(19, 26, 43, .12), 0 20px 36px -12px rgba(19, 26, 43, .42);
  /* the binder is a physical object, so it keeps its own colors in both themes */
  --binder-cover: #8F1D24;
  --binder-cover-2: #6E141A;
  --binder-page: #16181D;
  --binder-ink: #E9E4DA;
  --font-display: "Chakra Petch", "Bahnschrift", "DIN Alternate", "Arial Narrow", sans-serif;
  --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail-w: 300px;
  --top-h: 64px;
  --tools-h: 104px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B101C; --sheet: #141B2C; --sheet-2: #1A2336; --ink: #E7EBF3; --muted: #97A1B6; --line: #27324B;
    --dex: #FF4B5E; --accent: #8DAEFF; --gold: #E8BE5E; --heart: #FF5C82; --ok: #4CC98A; --pocket: #0F1626;
    --gloss: rgba(255, 255, 255, .07); --scrim: rgba(3, 6, 12, .82);
    --shadow-card: 0 1px 1px rgba(0, 0, 0, .45), 0 8px 18px -6px rgba(0, 0, 0, .65);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .5), 0 22px 40px -12px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0B101C; --sheet: #141B2C; --sheet-2: #1A2336; --ink: #E7EBF3; --muted: #97A1B6; --line: #27324B;
  --dex: #FF4B5E; --accent: #8DAEFF; --gold: #E8BE5E; --heart: #FF5C82; --ok: #4CC98A; --pocket: #0F1626;
  --gloss: rgba(255, 255, 255, .07); --scrim: rgba(3, 6, 12, .82);
  --shadow-card: 0 1px 1px rgba(0, 0, 0, .45), 0 8px 18px -6px rgba(0, 0, 0, .65);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .5), 0 22px 40px -12px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--font-body); }
body.lb-open { overflow: hidden; }
img { max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 64px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sheet); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.lens {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle at 34% 32%, rgba(255, 255, 255, .95) 0 13%, transparent 14%), var(--dex);
  box-shadow: 0 0 0 3px var(--sheet), 0 0 0 5px var(--line);
}
.brand h1 { margin: 0; font: 700 20px/1.1 var(--font-display); letter-spacing: .01em; white-space: nowrap; }
.brand .stats { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }

.notice {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--gold) 15%, var(--sheet)); border-bottom: 1px solid var(--line); font-size: 14px;
}
.notice.warn { background: color-mix(in srgb, var(--heart) 13%, var(--sheet)); }
.notice p { margin: 0; flex: 1 1 360px; max-width: 90ch; }
.notice .row { display: flex; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--sheet); color: var(--ink); font: 600 13.5px/1.1 var(--font-body); text-decoration: none; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn .n { font: 600 12.5px var(--font-mono); color: var(--muted); }
.btn.is-on { color: var(--heart); }
.btn.is-on .n { color: var(--heart); }
.icon-btn { width: 38px; height: 38px; padding: 0; }
.link-btn { border: 0; background: none; padding: 4px 2px; color: var(--accent); font: 600 13px var(--font-body); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); align-items: start; }
.rail {
  position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); height: calc(100dvh - var(--top-h));
  display: flex; flex-direction: column; background: var(--sheet); border-right: 1px solid var(--line);
}
.rail-tools { display: grid; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.rail-row { display: flex; gap: 8px; }
.rail-row select { flex: 1; min-width: 0; }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
input[type="search"], select {
  width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--sheet-2); color: var(--ink); font: 500 14px var(--font-body);
}
.search-wrap input { padding-left: 34px; }
input::placeholder { color: var(--muted); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--sheet-2); border: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: transparent; padding: 6px 10px; border-radius: 7px; color: var(--muted); font: 600 12.5px/1.2 var(--font-body); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .12); }
#starFilter svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
#starFilter[aria-pressed="true"] { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
#starFilter[aria-pressed="true"] svg { fill: currentColor; }

.dex-list { position: relative; list-style: none; margin: 0; padding: 0 6px 10px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.dex-list li { display: flex; align-items: center; gap: 2px; }
.dex-list li.region-head {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin: 0 -6px 4px; padding: 10px 14px 7px; background: var(--sheet); border-bottom: 1px solid var(--line);
}
.region-head b { font: 700 13px/1 var(--font-display); letter-spacing: .09em; text-transform: uppercase; }
.region-head span { font: 500 11.5px var(--font-mono); color: var(--muted); }
.dex-item {
  flex: 1; min-width: 0; display: grid; grid-template-columns: 38px 2.4em minmax(0, 1fr) auto; align-items: center; gap: 6px;
  padding: 2px 6px 2px 2px; border: 0; border-radius: 9px; background: transparent; text-align: left; scroll-margin-top: 46px;
}
.dex-item:hover { background: var(--sheet-2); }
.dex-item[aria-current="true"] { background: var(--sheet-2); box-shadow: inset 0 0 0 1px var(--line); }
.dex-item[aria-current="true"] .no { color: var(--dex); }
.dex-item[aria-current="true"] .nm { font-weight: 700; }
.sprite { width: 38px; height: 38px; margin: -1px 0; object-fit: contain; }
.dex-item .no { font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.dex-item .nm { font-weight: 500; font-size: 14.5px; line-height: 1.2; }
.dex-item .ct { min-width: 2em; text-align: right; font: 600 12px var(--font-mono); color: var(--muted); opacity: .55; font-variant-numeric: tabular-nums; }
.dex-item .ct.has { opacity: 1; color: var(--ink); }
.star { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--muted); opacity: .45; }
.star:hover { opacity: 1; background: var(--sheet-2); }
.star svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.star[aria-pressed="true"] { color: var(--gold); opacity: 1; }
.star[aria-pressed="true"] svg { fill: currentColor; }
.rail-empty { padding: 20px 12px; color: var(--muted); font-size: 14px; }

/* ---------- main ---------- */
.main { min-width: 0; padding-block: 22px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 860px) { .main { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.back-btn { display: none; margin-bottom: 14px; }

.mon-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 24px; }
.mon-art {
  width: 172px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 56%, color-mix(in srgb, var(--t1) 34%, transparent) 0 52%, transparent 70%);
}
.mon-art img { width: 86%; height: 86%; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .22)); }
.mon-art img.pixel { image-rendering: pixelated; }
.kicker { margin: 0; font: 600 13px/1 var(--font-mono); letter-spacing: .08em; color: var(--dex); text-transform: uppercase; }
.mon-name { margin: 6px 0 8px; font: 700 clamp(30px, 4.2vw, 46px)/1.02 var(--font-display); letter-spacing: .005em; text-wrap: balance; }
.types { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.type { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; }
.type i { width: 10px; height: 10px; border-radius: 50%; }
.summary { margin: 0; color: var(--muted); font-size: 14px; }
.summary b { color: var(--ink); font-weight: 600; }
.star-btn[aria-pressed="true"] { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
.star-btn svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.star-btn[aria-pressed="true"] svg { fill: currentColor; }

.toolbar { margin-top: 22px; display: grid; gap: 12px; padding: 14px; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--sheet-2); color: var(--ink); font: 600 13px/1.1 var(--font-body);
}
.chip .n { font: 500 12px var(--font-mono); color: var(--muted); }
.chip[aria-pressed="false"] { background: transparent; color: var(--muted); border-style: dashed; }
.chip[aria-pressed="false"] .dot { opacity: .3; }
.chip.zero { opacity: .55; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.dot-sir { background: conic-gradient(from 210deg, #F6D365, #E0A526, #FFF1B8, #E0A526, #F6D365); }
.dot-ir { background: #E0A526; }
.dot-fullart { background: linear-gradient(135deg, #C9D3E3, #7C8AA5); }
.dot-gallery { background: #8E6BD8; }
.dot-special { background: #1FA59A; }
.dot-shiny { background: conic-gradient(#FF7AC6, #7AD7FF, #FFE27A, #FF7AC6); }
.dot-secret { background: conic-gradient(#F2C14E, #E86A92, #6FC3F0, #8EE07C, #F2C14E); }
.dot-classic { background: #3B4F7A; }
.dot-promo { background: #262626; box-shadow: inset 0 0 0 2px #8A8F99; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.controls label, .fav-toolbar label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.controls select, .fav-toolbar select { width: auto; padding-block: 7px; }
.controls input[type="search"] { flex: 1 1 220px; width: auto; min-width: 0; padding-block: 7px; }

.group { margin-top: 32px; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding-bottom: 10px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.group-head h3 { margin: 0; font: 600 19px/1.2 var(--font-display); letter-spacing: .01em; }
.group-head .n { font: 500 13px var(--font-mono); color: var(--muted); }
.group-head p { flex-basis: 100%; margin: 2px 0 0; max-width: 72ch; color: var(--muted); font-size: 13.5px; }
.stars { color: var(--gold); letter-spacing: 1px; margin-right: 6px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 24px 16px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 10px; } }

.card { min-width: 0; display: flex; flex-direction: column; gap: 9px; }
.sleeve {
  position: relative; padding: 7px; border-radius: 13px;
  background: linear-gradient(180deg, var(--gloss), transparent 55%), var(--pocket);
  box-shadow: inset 0 0 0 1px var(--line);
}
.card-img {
  position: relative; display: block; width: 100%; aspect-ratio: 63 / 88; padding: 0; border: 0;
  border-radius: 4.8% / 3.4%; overflow: hidden; background: var(--sheet-2); cursor: zoom-in;
  box-shadow: var(--shadow-card);
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform .35s ease, box-shadow .35s ease;
}
.card-img img { position: relative; z-index: 1; display: block; width: 100%; height: 100%; object-fit: cover; }
.card-img .fallback {
  position: absolute; inset: 0; display: none; place-content: center; gap: 4px; padding: 12px; text-align: center;
  color: var(--muted); font-size: 13px; font-weight: 600;
}
.card-img .fallback small { font-weight: 500; font-size: 12px; }
.card-img.no-img .fallback { display: grid; }
.card-img::after {
  content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .35s ease;
  background:
    radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 42%),
    linear-gradient(115deg, transparent 22%, rgba(255, 110, 196, .34) 38%, rgba(110, 214, 255, .34) 50%, rgba(255, 232, 120, .34) 62%, transparent 78%);
  background-size: 100% 100%, 260% 260%;
  background-position: center, var(--mx, 50%) var(--my, 50%);
  mix-blend-mode: overlay;
}
.card-img:hover { transition: transform .08s linear, box-shadow .35s ease; box-shadow: var(--shadow-lift); }
.card-img:hover::after, .card-img:focus-visible::after { opacity: .85; }
@media (prefers-reduced-motion: reduce) {
  .card-img { transform: none !important; transition: none; }
  .card-img::after { display: none; }
}
.heart {
  position: absolute; top: 13px; right: 13px; z-index: 3; width: 34px; height: 34px; display: grid; place-items: center;
  border: 0; border-radius: 50%; color: var(--muted);
  background: color-mix(in srgb, var(--sheet) 86%, transparent); box-shadow: 0 1px 4px rgba(0, 0, 0, .28);
  opacity: 0; transition: opacity .15s ease, transform .15s ease;
}
.heart svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.card:hover .heart, .heart:focus-visible, .heart[aria-pressed="true"] { opacity: 1; }
.heart[aria-pressed="true"] { color: var(--heart); }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.heart:active { transform: scale(.88); }
@media (hover: none) { .heart { opacity: 1; } }

.card-meta { display: grid; gap: 3px; padding: 0 4px; font-size: 13px; }
.card-meta p { margin: 0; }
.card-name { font-weight: 700; font-size: 14px; line-height: 1.25; }
.card-set { display: flex; align-items: flex-start; gap: 6px; color: var(--muted); line-height: 1.3; }
.sym { width: 16px; height: 16px; margin-top: 1px; object-fit: contain; flex: none; }
.card-line { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.card-rarity { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
.card-rarity .stars { margin-right: 4px; }

.empty { margin-top: 28px; padding: 28px; border: 1px dashed var(--line); border-radius: 14px; background: var(--sheet); max-width: 640px; }
.empty h3 { margin: 0 0 6px; font: 600 19px var(--font-display); }
.empty p { margin: 0 0 12px; color: var(--muted); }
.empty .row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- favorites ---------- */
.fav-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.fav-head .mon-name { margin: 6px 0 6px; }
.fav-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.save-line { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 13.5px; color: var(--muted); }
.save-line i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.save-line.warn i { background: var(--heart); }
.fav-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.mon-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.mon-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 12px 2px 2px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); font-weight: 600; font-size: 13.5px; }
.mon-chip img { width: 38px; height: 38px; object-fit: contain; }
.mon-chip .n { font: 500 12px var(--font-mono); color: var(--muted); }
.group-head .link-btn { font: inherit; color: inherit; text-decoration-color: var(--line); }

.safekeep { margin-top: 36px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet); max-width: 820px; display: grid; gap: 12px; }
.safekeep h3 { margin: 0; font: 600 17px var(--font-display); }
.safe-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.safe-list li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; }
.safe-list li > i { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--ok); }
.safe-list li.warn > i { background: var(--heart); }
.safe-list li.idle > i { background: var(--line); }
.safe-list p { margin: 0; }
.safe-list .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.safe-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.save-line.idle i { background: var(--gold); }
.token-steps { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
.token-steps a { color: var(--accent); font-weight: 600; }
.token-steps b { color: var(--ink); font-weight: 600; }
.token-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.token-form input { flex: 1 1 240px; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet-2); color: var(--ink); font: 500 13.5px var(--font-mono); }

/* ---------- binder ---------- */
.binder-wrap { --cw: 120px; --g: 8px; --pp: 14px; --cover: 14px; --spine: 42px; margin-top: 24px; user-select: none; -webkit-user-select: none; }
.spread {

<script>
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const DATA = JSON.parse($('#kai-data').textContent);
  const spriteUrl = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
  const KEY = 'kanto-art-card-index:v1'; // kept from the first version so saved favorites carry over
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const narrow = matchMedia('(max-width: 859px)');

  const REGIONS = [
    { k: 'kanto', name: 'Kanto', lo: 1, hi: 151 },
    { k: 'johto', name: 'Johto', lo: 152, hi: 251 },
    { k: 'hoenn', name: 'Hoenn', lo: 252, hi: 386 },
    { k: 'sinnoh', name: 'Sinnoh', lo: 387, hi: 493 },
    { k: 'unova', name: 'Unova', lo: 494, hi: 649 },
    { k: 'kalos', name: 'Kalos', lo: 650, hi: 721 },
    { k: 'alola', name: 'Alola', lo: 722, hi: 809 },
    { k: 'galar', name: 'Galar', lo: 810, hi: 905 },
    { k: 'paldea', name: 'Paldea', lo: 906, hi: 1025 }
  ];
  const regionOf = id => REGIONS.find(r => id >= r.lo && id <= r.hi);
  const CATS = [
    { k: 'sir', label: 'Special Illustration Rare', short: 'SIR', stars: '★★', desc: 'Edge-to-edge scenes, mostly of ex Pokémon. Two gold stars on the card. Scarlet & Violet and Mega Evolution sets, 2023 onward.' },
    { k: 'ir', label: 'Illustration Rare', short: 'IR', stars: '★', desc: 'Full-art illustrations of regular Pokémon. One gold star on the card. 2023 onward.' },
    { k: 'fullart', label: 'Full Art & Alt Art', short: 'Full art', desc: 'Textured full-art EX, GX, V and ex cards, including the Sword & Shield alternate arts. 2011 onward.' },
    { k: 'gallery', label: 'Trainer & Galarian Gallery', short: 'Gallery', desc: 'Character-art subsets in Brilliant Stars, Astral Radiance, Lost Origin, Silver Tempest and Crown Zenith (2022–2023).' },
    { k: 'special', label: 'Special Rares', short: 'Special', desc: 'LEGEND two-card pairs, Radiant Collection, Amazing Rare, the 30th Celebration Pikachu cards, Futuristic Rare and Mega Attack Rare.' },
    { k: 'shiny', label: 'Shiny & Gold Star', short: 'Shiny', desc: 'Shiny Vault, Shiny Rare, Radiant, Shining, Call of Legends shiny legendaries and Gold Star cards.' },
    { k: 'secret', label: 'Gold, Rainbow & Secret', short: 'Secret', desc: 'Secret rares numbered past the set total: gold, rainbow and alt-art secret rares.' },
    { k: 'classic', label: 'Classic Collection', short: 'Classic', desc: 'Anniversary reprints in Celebrations (2021) and 30th Celebration (2026).' },
    { k: 'promo', label: 'Black Star Promos', short: 'Promos', desc: 'Every Black Star promo since 2007. Some have special art and some reuse a regular card.' }
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.k, c]));
  const DEFAULT_CATS = CATS.map(c => c.k);
  const STARS = { 'Illustration Rare': '★', 'Special Illustration Rare': '★★', 'Hyper Rare': '★★★' };
  const TYPE_COLOR = { normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', electric: '#F2C523', grass: '#62B544', ice: '#7FD0CC', fighting: '#C22E28', poison: '#A33EA1', ground: '#D9B04F', flying: '#9C84E8', psychic: '#F95587', bug: '#98AC1A', rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746', steel: '#A7A7C4', fairy: '#D685AD' };
  const ERA_ORDER = ['Mega Evolution', 'Scarlet & Violet', 'Sword & Shield', 'Sun & Moon', 'XY', 'Black & White', 'HeartGold & SoulSilver', 'Platinum', 'Diamond & Pearl', 'EX', 'Other'];
  const MONTHS = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ');
  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6s-7.6-4.6-9.6-9.3C1 7.8 3.3 4.4 6.8 4.4c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.5 0 5.8 3.4 4.4 6.9-2 4.7-9.6 9.3-9.6 9.3z"/></svg>';
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>';
  const PER_PAGE = 9;

  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const pad3 = n => String(n).padStart(3, '0');
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const plural = (n, one, many) => `${n.toLocaleString('en-US')} ${n === 1 ? one : (many || one + 's')}`;
  const fmtMonth = d => `${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}`;
  const fmtDay = d => `${+d.slice(8, 10)} ${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}`;
  const fmtTime = ts => new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/♀/g, 'f').replace(/♂/g, 'm').replace(/[^a-z0-9]/g, '');
  const bigUrl = u => !u ? '' : u.includes('images.pokemontcg.io') ? u.replace(/\.png$/, '_hires.png')
    : u.includes('scrydex.com') ? u.replace(/\/small$/, '/large') : u.includes('tcgdex.net') ? u.replace('/low.webp', '/high.webp') : u;
  const artUrl = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;

  /* ---------- data ---------- */
  const MON = DATA.pokemon;
  const MAX_DEX = MON.length;
  const SETS = DATA.sets;
  const cards = DATA.cards.map(c => {
    const set = SETS[c.s];
    const card = Object.assign({}, c, {
      set, date: set.d, year: set.d.slice(0, 4), promo: !!set.p,
      // the R/RGB, G/RGB and B/RGB Mews have letters for numbers; keep them in that order after the set's numbered cards
      num: /^[RGB]\/RGB$/.test(c.no) ? 1000 + 'RGB'.indexOf(c.no[0]) : parseInt((c.no.match(/\d+/) || ['0'])[0], 10),
      dex: Array.from(new Set(c.dx)).filter(d => d >= 1 && d <= MAX_DEX)
    });
    card.q = norm([c.n, set.n, c.a, c.no, c.r, set.e].join(' '));
    return card;
  });
  const byId = new Map(cards.map(c => [c.i, c]));
  const byDex = new Map(MON.map(m => [m.id, []]));
  cards.forEach(c => c.dex.forEach(d => byDex.get(d).push(c)));

  /* ---------- saving ----------
     Settings stay in this browser. Favorites belong to profiles, which live in a Firebase Realtime Database,
     so every device sees them. There is no sign-in: anyone with the link can pick, change or delete any
     profile. Each change is written one card at a time, so two devices editing the same profile don't
     overwrite each other, and changes made while offline wait in a queue until the database is reachable. */
  let storageOK = true;
  function readJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { storageOK = false; }
  }
  try { localStorage.setItem(KEY + ':check', '1'); localStorage.removeItem(KEY + ':check'); } catch (e) { storageOK = false; }
  const saved = readJSON(KEY, {}) || {};
  const PROFILE_KEY = KEY + ':profile';
  const CACHE_KEY = KEY + ':profiles';
  const QUEUE_KEY = KEY + ':pending';
  const LEGACY_KEY = KEY + ':this-browser';
  // favorites saved by earlier versions in this browser wait here until they're added to a profile
  if ((Array.isArray(saved.favC) && saved.favC.length) || (Array.isArray(saved.favP) && saved.favP.length)) {
    if (!readJSON(LEGACY_KEY, null)) writeJSON(LEGACY_KEY, { favC: saved.favC || [], favP: saved.favP || [] });
  }
  function toFavMap(list) {
    const m = new Map();
    if (!Array.isArray(list)) return m;
    const base = Date.now() - list.length * 1000;
    list.forEach((x, i) => {
      if (typeof x === 'string') m.set(x, base + i * 1000); // the first version stored plain ids
      else if (Array.isArray(x) && typeof x[0] === 'string') m.set(x[0], +x[1] || base + i * 1000);
      else if (x && typeof x.id === 'string') m.set(x.id, Date.parse(x.added) || +x.added || base + i * 1000);
    });
    return m;
  }
  function toDexMap(list) {
    const m = new Map();
    if (!Array.isArray(list)) return m;
    list.forEach(x => {
      if (Number.isInteger(x)) m.set(x, 1);
      else if (Array.isArray(x) && Number.isInteger(x[0])) m.set(x[0], +x[1] || 1);
    });
    return m;
  }
  const state = {
    favP: new Map(),
    favC: new Map(),
    pid: readJSON(PROFILE_KEY, null),
    cats: new Set(Array.isArray(saved.cats)
      ? saved.cats.filter(k => CAT[k]).concat((saved.v || 0) < 5 && !saved.cats.includes('promo') ? ['promo'] : [])
      : DEFAULT_CATS),
    sort: saved.sort === 'old' ? 'old' : 'new',
    group: saved.group === 'era' ? 'era' : 'rarity',
    theme: saved.theme === 'dark' || saved.theme === 'light' ? saved.theme : null,
    favView: saved.favView === 'grid' ? 'grid' : 'binder',
    binderSort: ['dex', 'added', 'release'].includes(saved.binderSort) ? saved.binderSort : 'dex',
    binderRegion: ['all'].concat(REGIONS.map(r => r.k)).includes(saved.binderRegion) ? saved.binderRegion : 'all',
    spread: Number.isInteger(saved.spread) ? saved.spread : 0,
    last: saved.last,
    listMode: 'all', query: '', cardQuery: '', view: null,
    lbList: [], lbIndex: -1
  };
  function save() {
    writeJSON(KEY, {
      v: 5, cats: Array.from(state.cats), sort: state.sort, group: state.group, theme: state.theme, last: state.view,
      favView: state.favView, binderSort: state.binderSort, binderRegion: state.binderRegion, spread: state.spread
    });
  }

  /* profiles in Firebase: /profiles/{id} = { name, color, created, updated, cards: {cardId: addedAt}, pokemon: {dex: starredAt} } */
  const DB_URL = 'https://pokemontcg-5f452-default-rtdb.asia-southeast1.firebasedatabase.app';
  const PALETTE = ['#E4572E', '#2F80ED', '#13A37F', '#D9930D', '#8B5CF6', '#E2498A', '#0F9AA8', '#5B6CF0', '#6E9F1A', '#D64545', '#1E9BD7', '#A15CD6'];
  const cloud = { profiles: readJSON(CACHE_KEY, {}), queue: readJSON(QUEUE_KEY, []), status: 'idle', at: 0, flushing: false, lastPull: 0, loaded: false, refused: 0 };
  if (!cloud.profiles || typeof cloud.profiles !== 'object' || Array.isArray(cloud.profiles)) cloud.profiles = {};
  if (!Array.isArray(cloud.queue)) cloud.queue = [];
  const validKey = k => /^[A-Za-z0-9_-]{1,60}$/.test(k);

  function applyPatch(p, patch) {
    Object.keys(patch).forEach(path => {
      const parts = path.split('/');
      let o = p;
      for (let i = 0; i < parts.length - 1; i++) {
        if (!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
        o = o[parts[i]];
      }
      if (patch[path] === null) delete o[parts[parts.length - 1]];
      else o[parts[parts.length - 1]] = patch[path];
    });
    return p;
  }
  const profileList = () => Object.keys(cloud.profiles)
    .filter(pid => cloud.profiles[pid] && typeof cloud.profiles[pid].name === 'string')
    .sort((a, b) => (cloud.profiles[a].created || 0) - (cloud.profiles[b].created || 0));
  const activeProfile = () => (state.pid && cloud.profiles[state.pid] && typeof cloud.profiles[state.pid].name === 'string') ? cloud.profiles[state.pid] : null;
  const profileColor = p => PALETTE[(p && Number.isInteger(p.color) ? p.color : 0) % PALETTE.length];
  const initial = p => esc((p.name.trim().charAt(0) || '?').toUpperCase());
  function loadActive() {
    const p = activeProfile();
    state.favC = new Map(Object.entries((p && p.cards) || {}).map(([k, v]) => [k, +v || 1]));
    state.favP = new Map(Object.entries((p && p.pokemon) || {}).map(([k, v]) => [+k, +v || 1]).filter(([k]) => Number.isInteger(k)));
  }
  function saveCloud() { writeJSON(CACHE_KEY, cloud.profiles); writeJSON(QUEUE_KEY, cloud.queue); }
  function queueWrite(pid, patch) {
    patch.updated = Date.now();
    applyPatch(cloud.profiles[pid] || (cloud.profiles[pid] = {}), patch);
    cloud.queue.push({ pid, patch });
    saveCloud();
    flushQueue();
  }
  async function flushQueue() {
    if (cloud.flushing || !cloud.queue.length) return;
    cloud.flushing = true;
    cloud.status = 'saving';
    renderCloud();
    try {
      while (cloud.queue.length) {
        const op = cloud.queue[0];
        const res = await fetch(`${DB_URL}/profiles/${encodeURIComponent(op.pid)}.json`,
          op.del ? { method: 'DELETE' } : { method: 'PATCH', body: JSON.stringify(op.patch) });
        if (res.status >= 500 || res.status === 429) throw new Error('server');
        if (!res.ok) cloud.refused++; // the database turned this change down, for example because the profile was deleted elsewhere
        cloud.queue.shift();
        saveCloud();
      }
      cloud.status = 'ok';
      cloud.at = Date.now();
    } catch (e) {
      cloud.status = 'offline';
    }
    cloud.flushing = false;
    if (cloud.refused) { toast('A change couldn’t be saved. The profile may have been renamed or deleted on another device.', 6000); cloud.refused = 0; }
    renderCloud();
  }
  async function pullProfiles() {
    cloud.lastPull = Date.now();
    try {
      const res = await fetch(`${DB_URL}/profiles.json`, { cache: 'no-store' });
      if (!res.ok) throw new Error('http');
      const data = (await res.json()) || {};
      cloud.queue.forEach(op => { if (op.del) delete data[op.pid]; else applyPatch(data[op.pid] || (data[op.pid] = {}), op.patch); });
      cloud.profiles = data;
      cloud.loaded = true;
      if (!cloud.flushing) cloud.status = 'ok';
      cloud.at = Date.now();
      saveCloud();
      if (state.pid && !activeProfile()) { state.pid = null; writeJSON(PROFILE_KEY, null); }
      loadActive();

      flushQueue();

    cloud.queue = cloud.queue.filter(op => op.pid !== pid);
    cloud.queue.push({ pid, del: true });
    saveCloud();
    state.pid = null;
    writeJSON(PROFILE_KEY, null);
    loadActive();
    renderProfileBtn();
    renderProfiles();
    refreshAll();
    flushQueue();

  function mergeLegacy() {
    const old = readJSON(LEGACY_KEY, null);
    const p = activeProfile();
    if (!old || !p) return;
    const patch = {};
    toFavMap(old.favC).forEach((ts, id) => { if (validKey(id) && !(p.cards || {})[id]) patch['cards/' + id] = ts; });
    toDexMap(old.favP).forEach((ts, dex) => { if (dex >= 1 && dex <= MAX_DEX && !(p.pokemon || {})[dex]) patch['pokemon/' + dex] = ts; });
    try { localStorage.removeItem(LEGACY_KEY); } catch (e) { /* nothing to clear */ }
    const n = Object.keys(patch).length;
    if (n) {
      queueWrite(state.pid, patch);
      setTimeout(() => toast(`Added ${plural(n, 'favorite')} saved earlier in this browser to ${p.name}’s profile`, 6000), 400);
    }

  function payload() {

      app: 'Pokédex Art Card Index', version: 4, profile: p ? p.name : '', exported: new Date().toISOString(),
      pokemon: Array.from(state.favP.keys()).sort((a, b) => a - b),
      cards: Array.from(state.favC.entries()).map(([id, ts]) => ({ id, name: byId.has(id) ? byId.get(id).n : undefined, added: new Date(ts).toISOString() }))
    };

  function importPayload(j) {
    if (!j || typeof j !== 'object' || (!Array.isArray(j.cards) && !Array.isArray(j.pokemon))) throw new Error('not a backup');
    const patch = {};
    toFavMap(j.cards).forEach((ts, id) => { if (validKey(id) && !state.favC.has(id)) patch['cards/' + id] = ts; });
    toDexMap(j.pokemon).forEach((ts, dex) => { if (dex >= 1 && dex <= MAX_DEX && !state.favP.has(dex)) patch['pokemon/' + dex] = ts; });

  const main = $('#main');

  function favCards() { return Array.from(state.favC.keys()).map(id => byId.get(id)).filter(Boolean); }

  const binder = { list: [], two: true, animating: false, dirty: false };

  <div class="plate"><b>Favorites</b><span>${plural(binder.list.length, 'card')} · ${plural(pages, 'page')}</span></div>
  <div class="cover-sprites">${dexes.map(d => `<img src="${spriteUrl(d)}" alt="" title="${esc(MON[d - 1].n)}">`).join('')}</div>
  <p class="note">${arr}${state.binderRegion === 'all' ? '' : ` · ${REGIONS.find(r => r.k === state.binderRegion).name} only`}.</p>
</div><span class="pno">Inside cover</span></div>`;
    }
    if (pi > pages) {
      return `<div class="page ${sideCls} inside"><div class="pad"><p class="note">End of binder. New favorites fill the next empty pocket.</p></div><span class="pno">&nbsp;</span></div>`;
    }
    const slice = binder.list.slice((pi - 1) * PER_PAGE, pi * PER_PAGE);
    let pockets = slice.map(c => `<div class="pocket">`
      + `<button class="pk-card${c.im ? '' : ' no-img'}" type="button" data-bopen="${esc(c.i)}" aria-label="${esc(c.n)}, ${esc(c.set.n)} ${esc(c.no)}">${c.im ? `<img src="${esc(c.im)}" alt="" loading="lazy" decoding="async">` : esc(c.n)}</button>`
      + `<button class="heart" type="button" data-fav="${esc(c.i)}" aria-pressed="true" aria-label="Remove ${esc(c.n)} from favorites">${HEART}</button></div>`).join('');
    for (let i = slice.length; i < PER_PAGE; i++) pockets += '<div class="pocket" aria-hidden="true"></div>';
    return `<div class="page ${sideCls}" role="group" aria-label="Page ${pi}">${pockets}<span class="pno">${pi}</span></div>`;
  }
  function spreadPages(s) { return binder.two ? [s * 2, s * 2 + 1] : [s]; }
  function drawSpread() {
    const el = $('#spread');
    if (!el) return;
    const { spreads, pages } = binderModel();
    state.spread = Math.min(Math.max(0, state.spread), spreads - 1);
    const ps = spreadPages(state.spread);
    const ring = '<div class="spine" aria-hidden="true"><span class="ring"></span><span class="ring"></span><span class="ring"></span></div>';
    el.innerHTML = binder.two
      ? `<div class="slot" id="slotL">${pageHTML(ps[0], 'left')}</div>${ring}<div class="slot" id="slotR">${pageHTML(ps[1], 'right')}</div>`
      : `${ring}<div class="slot" id="slotR">${pageHTML(ps[0], 'right')}</div>`;
    const range = $('#binderRange');
    range.max = String(spreads);
    range.value = String(state.spread + 1);
    range.disabled = spreads < 2;
    const shown = ps.filter(p => p >= 1 && p <= pages);
    $('#binderPos').textContent = shown.length === 0 ? `Inside cover · ${plural(pages, 'page')}`
      : shown.length === 1 ? `Page ${shown[0]} of ${pages}` : `Pages ${shown[0]}–${shown[1]} of ${pages}`;
    $('[data-flip="-1"]').disabled = state.spread <= 0;
    $('[data-flip="1"]').disabled = state.spread >= spreads - 1;
  }
  function flip(dir) {
    if (binder.animating || !$('#spread')) return;
    const { spreads } = binderModel();
    const next = state.spread + dir;
    if (next < 0 || next >= spreads) return;
    const prev = state.spread;
    state.spread = next;
    save(false);
    if (reduceMotion.matches || !Element.prototype.animate) return drawSpread();
    if (!binder.two) {
      drawSpread();
      const page = $('#slotR .page');
      if (page) page.animate([{ transform: `translateX(${dir * 28}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'ease-out' });
      return;
    }
    const spread = $('#spread');
    const [ol, or] = spreadPages(prev);
    const [nl, nr] = spreadPages(next);
    const leaf = document.createElement('div');
    leaf.className = 'leaf ' + (dir > 0 ? 'next' : 'prev');
    leaf.innerHTML = dir > 0
      ? `<div class="face front">${pageHTML(or, 'right')}<div class="shade"></div></div><div class="face back">${pageHTML(nl, 'left')}<div class="shade"></div></div>`
      : `<div class="face front">${pageHTML(ol, 'left')}<div class="shade"></div></div><div class="face back">${pageHTML(nr, 'right')}<div class="shade"></div></div>`;
    if (dir > 0) $('#slotR').innerHTML = pageHTML(nr, 'right'); else $('#slotL').innerHTML = pageHTML(nl, 'left');
    spread.appendChild(leaf);
    binder.animating = true;
    const dur = 620;
    const anim = leaf.animate([{ transform: 'rotateY(0deg)' }, { transform: `rotateY(${dir > 0 ? -180 : 180}deg)` }], { duration: dur, easing: 'cubic-bezier(.35,.05,.25,1)' });
    const shades = $$('.shade', leaf);
    shades[0].animate([{ opacity: 0 }, { opacity: .55 }], { duration: dur / 2, fill: 'forwards' });
    shades[1].animate([{ opacity: .55 }, { opacity: .55, offset: .5 }, { opacity: 0 }], { duration: dur, fill: 'forwards' });
    anim.onfinish = () => { binder.animating = false; leaf.remove(); drawSpread(); };
  }
  function jumpSpread(n) { state.spread = n; save(false); drawSpread(); }

  function renderSafe() {
    const p = activeProfile();
    const line = $('#saveLine');
    if (line) {
      const text = !p ? 'No profile chosen'
        : { saving: 'Saving…', offline: 'Offline · changes upload when you’re back online' }[cloud.status] || 'Saved online · opens on any device';
      line.className = 'save-line' + (!p ? ' idle' : cloud.status === 'offline' ? ' warn' : '');
      line.innerHTML = `<i></i>${text}`;
    }
    const box = $('#safekeep');
    if (!box) return;
    const first = !p
      ? `<li class="idle"><i></i><div><p>No profile chosen.</p><p class="sub"><button class="link-btn" type="button" data-pf-open>Choose or add a profile</button> to start a binder that shows up on every device.</p></div></li>`
      : cloud.status === 'offline'
        ? `<li class="warn"><i></i><div><p>Can’t reach the database right now.</p><p class="sub">Your changes are kept in this browser and upload the next time the site is online${cloud.queue.length ? ` (${plural(cloud.queue.length, 'change')} waiting)` : ''}.</p></div></li>`
        : `<li><i></i><div><p>Saved online in ${esc(p.name)}’s profile.</p><p class="sub">Open the site on any device or browser, private windows included, pick ${esc(p.name)}, and this binder is there.</p></div></li>`;
    box.innerHTML = `<h3>How favorites are saved</h3><ul class="safe-list">${first}
<li class="idle"><i></i><div><p>No passwords.</p><p class="sub">Anyone with this site’s link can open, change or delete any profile. Download a backup now and then. Load a backup adds it back into the profile you have open.</p></div></li></ul>
<div class="safe-actions"><button class="btn" type="button" data-export${p ? '' : ' disabled'}>Download backup</button><button class="btn" type="button" data-import${p ? '' : ' disabled'}>Load a backup</button></div>`;
  }

  /* ---------- profile picker ---------- */
  const pf = $('#profiles');
  let pfReturn = null;
  function renderCloud() { renderSafe(); renderProfiles(); }
  function renderProfileBtn() {
    const p = activeProfile();

      ? `<span class="avatar" style="background:${profileColor(p)}">${initial(p)}</span><span class="pf-name">${esc(p.name)}</span>`

  }
  function renderProfiles() {
    if (pf.hidden) return;
    const ids = profileList();
    $('#pfList').innerHTML = ids.length ? ids.map(pid => {
      const p = cloud.profiles[pid];

        + `<span class="avatar" style="background:${profileColor(p)}">${initial(p)}</span><span class="pf-item-name">${esc(p.name)}</span><span class="n">${plural(n, 'card')}</span></button>`;
    }).join('') : `<p class="hint">${cloud.loaded ? 'No profiles yet. Add the first one below.' : cloud.status === 'offline' ? 'Can’t reach the profile list right now. You can still add a profile below.' : 'Loading profiles…'}</p>`;
    const p = activeProfile();
    $('#pfManage').innerHTML = p ? `<details class="pf-edit"><summary>Rename or delete ${esc(p.name)}</summary>
  <form class="pf-row" data-pf-rename autocomplete="off"><input id="pfRename" maxlength="24" value="${esc(p.name)}" aria-label="New name for ${esc(p.name)}" autocomplete="off"><button class="btn" type="submit">Rename</button></form>
  <div class="pf-row"><button class="btn danger" type="button" data-pf-delete>Delete this profile…</button></div>
  <div class="pf-confirm" id="pfConfirm" hidden><p>Delete ${esc(p.name)} and ${plural(state.favC.size, 'favorite')}? It’s removed for everyone who uses this site, and it can’t be undone.</p>
  <div class="pf-row"><button class="btn danger" type="button" data-pf-delete-yes>Delete</button><button class="btn" type="button" data-pf-delete-no>Keep it</button></div></div>
</details>` : '';

  function openProfiles(reason) {
    if (pf.hidden) pfReturn = document.activeElement;
    pf.hidden = false;
    document.body.classList.add('lb-open');
    $('#pfReason').textContent = reason || 'Pick your profile to see your binder, or add a new one. There are no passwords: anyone with this link can open any profile.';
    renderProfiles();
    if (Date.now() - cloud.lastPull > 15000) pullProfiles();
    setTimeout(() => { const f = $('#pfList [aria-current]') || $('#pfList button') || $('#pfName'); if (f) f.focus(); }, 0);
  }
  function closeProfiles() {
    if (pf.hidden) return;
    pf.hidden = true;
    pendingAction = null;
    if (lb.hidden) document.body.classList.remove('lb-open');
    try { sessionStorage.setItem(KEY + ':picker-seen', '1'); } catch (e) { /* asks again next visit */ }
    if (pfReturn && document.contains(pfReturn)) pfReturn.focus({ preventScroll: true });
  }

  function aboutHTML() {
    return `<details class="about">
  <summary>About this index</summary>
  <div class="about-body">
    <p>Covers every English-language Pokémon TCG release from ${fmtMonth(STATS.first)} through ${fmtDay(STATS.last)} (30th Celebration): ${STATS.art.toLocaleString('en-US')} special-art cards and ${STATS.promo.toLocaleString('en-US')} Black Star promos that show at least one Pokémon from #001 to #1025. Cards that show two Pokémon, such as TAG TEAMs and LEGEND pairs, appear under each of them.</p>
    <dl class="defs">${CATS.map(c => `<dt><i class="dot dot-${c.k}"></i>${esc(c.label)}</dt><dd>${esc(c.desc)}</dd>`).join('')}</dl>

  /* ---------- lightbox ---------- */
  const lb = $('#lightbox');
  let lastFocus = null;
  function openLightbox(id, ids) {
    state.lbList = ids || $$('[data-open]', main).map(b => b.dataset.open);
    state.lbIndex = Math.max(0, state.lbList.indexOf(id));
    lastFocus = document.activeElement;
    lb.hidden = false;
    document.body.classList.add('lb-open');
    showCard();
    $('#lbClose').focus();
  }
  function closeLightbox() {
    lb.hidden = true;
    document.body.classList.remove('lb-open');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
    if (binder.dirty) { binder.dirty = false; refreshAll(); }
  }
  function showCard() {
    const id = state.lbList[state.lbIndex];
    const c = byId.get(id);
    if (!c) return;
    const fig = $('#lbFigure');
    if (c.im) {
      fig.innerHTML = `<img id="lbImg" src="${esc(c.im)}" alt="${esc(c.n)} card from ${esc(c.set.n)}">`;
      const big = new Image();
      big.onload = () => { const img = $('#lbImg'); if (img && state.lbList[state.lbIndex] === id) img.src = big.src; };
      big.src = bigUrl(c.im);
    } else {
      fig.innerHTML = `<div class="lb-noimg">No scan of this card is available yet.</div>`;
    }
    $('#lbKicker').textContent = CAT[c.c].label;
    $('#lbTitle').textContent = c.n;
    const facts = [
      ['Set', `${esc(c.set.n)}<br><span class="soft">${esc(c.set.e)} era</span>`],
      ['Number', `<span class="mono">${esc(c.no)}</span>`],
      [c.promo ? 'Promo series' : 'Released', c.promo ? `Started ${fmtMonth(c.date)}` : fmtDay(c.date)],
      ['Rarity', `${STARS[c.r] ? `<span class="stars">${STARS[c.r]}</span>` : ''}${esc(c.r)}`],
      ['Illustrator', c.a ? esc(c.a) : '<span class="soft">Not listed yet</span>']
    ];
    if (state.favC.has(id)) facts.push(['Favorited', fmtTime(state.favC.get(id))]);
    $('#lbFacts').innerHTML = facts.map(f => `<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join('');
    const others = c.dex.filter(d => d !== state.view);
    $('#lbAlso').innerHTML = others.length
      ? `${typeof state.view === 'number' ? 'Also filed under' : 'Filed under'} ${others.map(d => `<button class="link-btn" type="button" data-mon="${d}">${esc(MON[d - 1].n)}</button>`).join(', ')}`
      : '';
    const fav = state.favC.has(id);
    const fb = $('#lbFav');
    fb.dataset.fav = id;
    fb.setAttribute('aria-pressed', String(fav));
    fb.querySelector('span').textContent = fav ? 'Favorited' : 'Favorite';
    const q = c.promo ? `${c.n} ${c.no}` : `${c.n} ${c.set.n} ${c.no.split('/')[0]}`;
    $('#lbTcg').href = `https://www.tcgplayer.com/search/pokemon/product?productLineName=pokemon&q=${encodeURIComponent(c.n + ' ' + (c.promo ? c.no : c.set.n))}`;
    $('#lbEbay').href = `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(q)}`;
    $('#lbPos').textContent = `${state.lbIndex + 1} / ${state.lbList.length}`;
    $('#lbPrev').disabled = state.lbIndex <= 0;
    $('#lbNext').disabled = state.lbIndex >= state.lbList.length - 1;
  }
  function stepLightbox(d) {
    const n = state.lbIndex + d;
    if (n < 0 || n >= state.lbList.length) return;
    state.lbIndex = n;
    showCard();
  }

  /* ---------- actions ---------- */
  function selectMon(id, opts) {
    opts = opts || {};
    state.view = id;
    save(false);
    try { history.replaceState(null, '', '#' + pad3(id)); } catch (e) { /* some browsers block this for local files */ }
    if (opts.open !== false) document.body.classList.add('detail-open');
    renderMon(id);
    markCurrent();
    if (opts.scroll !== false) window.scrollTo(0, 0);
  }
  function selectFav() {
    state.view = 'fav';
    save(false);
    try { history.replaceState(null, '', '#favorites'); } catch (e) { /* ignore */ }
    document.body.classList.add('detail-open'); // before rendering, so the binder can measure the visible width
    renderFav();
    markCurrent();
    window.scrollTo(0, 0);
  }
  function refreshAll() {
    renderRail();
    markCurrent();
    updateFavCount();
    if (state.view === 'fav') { const y = window.scrollY; renderFav(); window.scrollTo(0, y); }
    else if (typeof state.view === 'number') refreshCards();
  }
  function updateFavCount() {
    const n = favCards().length;
    $('#favCount').textContent = n;
    $('#favViewBtn').classList.toggle('is-on', n > 0);
  }
  function toggleFav(id) {
    if (!activeProfile()) { pendingAction = () => toggleFav(id); return openProfiles('Pick or add a profile first. Your favorites are saved to it and show up on any device.'); }
    if (!validKey(id)) return;
    const on = !state.favC.has(id);
    const ts = Date.now();
    if (on) state.favC.set(id, ts); else state.favC.delete(id);
    queueWrite(state.pid, { ['cards/' + id]: on ? ts : null });
    $$('.heart').filter(b => b.dataset.fav === id).forEach(b => {
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', `${on ? 'Remove from' : 'Add to'} favorites`);
    });
    if (!lb.hidden && $('#lbFav').dataset.fav === id) {
      $('#lbFav').setAttribute('aria-pressed', String(on));
      $('#lbFav').querySelector('span').textContent = on ? 'Favorited' : 'Favorite';
    }
    updateFavCount();
    if (state.view === 'fav') {
      if (lb.hidden) { const y = window.scrollY; renderFav(); window.scrollTo(0, y); }
      else binder.dirty = true;
    }
  }
  function toggleStar(id) {
    if (!activeProfile()) { pendingAction = () => toggleStar(id); return openProfiles('Pick or add a profile first. Starred Pokémon are saved to it.'); }
    const on = !state.favP.has(id);
    const ts = Date.now();
    if (on) state.favP.set(id, ts); else state.favP.delete(id);
    queueWrite(state.pid, { ['pokemon/' + id]: on ? ts : null });
    renderRail();
    markCurrent();
    $$('.star-btn').filter(b => +b.dataset.star === id).forEach(b => {
      b.setAttribute('aria-pressed', String(on));
      b.querySelector('span').textContent = on ? 'Starred' : 'Star';
    });
    if (state.view === 'fav') { const y = window.scrollY; renderFav(); window.scrollTo(0, y); }
  }
  function setCats(next) {
    state.cats = next;
    save(false);
    renderRail();
    markCurrent();
    refreshCards();
  }

  let toastTimer = 0;
  function toast(msg, ms) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, ms || 3600);
  }
  function showNotice(kind) {
    const n = $('#notice');
    if (kind === 'nostorage') {
      n.className = 'notice warn';
      n.innerHTML = `<p><b>This window can’t remember your settings or which profile you picked.</b> Favorites still save to your profile online.</p><div class="row"><button class="btn" type="button" data-dismiss>OK</button></div>`;
    }
    n.hidden = false;
    setTopH();
  }
  function hideNotice() { $('#notice').hidden = true; setTopH(); }

  function exportFavs() {
    const p = activeProfile();
    if (!p) return;
    const data = payload();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `pokedex-art-favorites-${slug(p.name)}-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    toast(`Downloaded a backup of ${p.name}’s ${plural(data.cards.length, 'card')} and ${plural(data.pokemon.length, 'starred Pokémon', 'starred Pokémon')}`);
  }
  $('#importFile').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!activeProfile()) return toast('Choose a profile first, then load the backup into it.');
    try {
      const n = importPayload(JSON.parse(await f.text()));
      refreshAll();
      toast(n ? `Added ${plural(n, 'favorite')} to ${activeProfile().name}’s profile` : 'Everything in that backup is already in this profile');
    } catch (err) {
      toast('That file isn’t a favorites backup. Choose the .json file this page saved.');
    }
  });

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('button, a');
    if (!t) return;
    const d = t.dataset;
    if (d.close !== undefined && t.closest('#lightbox')) return closeLightbox();
    if (d.fav) return toggleFav(d.fav);
    if (d.open) return openLightbox(d.open);
    if (d.bopen) return openLightbox(d.bopen, binder.list.map(c => c.i));
    if (d.star) return toggleStar(+d.star);
    if (d.mon) {
      if (!lb.hidden) { binder.dirty = false; closeLightbox(); }
      return selectMon(+d.mon);
    }
    if (d.jump) return jumpTo(d.jump);
    if (d.flip) return flip(+d.flip);
    if (d.favview) { state.favView = d.favview; save(false); return renderFav(); }
    if (d.cat) {
      const next = new Set(state.cats);
      if (next.has(d.cat)) next.delete(d.cat); else next.add(d.cat);
      return setCats(next);
    }
    if (d.showCat) { const next = new Set(state.cats); next.add(d.showCat); return setCats(next); }
    if (d.resetCats !== undefined) return setCats(new Set(DEFAULT_CATS));
    if (d.clearFilter !== undefined) { state.cardQuery = ''; const f = $('#cardFilter'); if (f) f.value = ''; return refreshCards(); }
    if (d.group) {
      state.group = d.group;
      save(false);
      $$('[data-group]', main).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.group === state.group)));
      return refreshCards();
    }
    if (d.back !== undefined) {
      document.body.classList.remove('detail-open');
      setTopH();
      markCurrent();
      // with 1,025 Pokémon, land back on the one you were looking at instead of the top of the list
      const cur = $('.dex-item[aria-current]', list);
      if (cur && narrow.matches) cur.scrollIntoView({ block: 'center' }); else window.scrollTo(0, 0);
      syncRegionTabs();
      return;
    }
    if (d.export !== undefined) return exportFavs();
    if (d.import !== undefined) return $('#importFile').click();
    if (d.pfOpen !== undefined) return openProfiles();
    if (d.pfClose !== undefined) return closeProfiles();
    if (d.pfSwitch) return switchProfile(d.pfSwitch);
    if (d.pfDelete !== undefined) { $('#pfConfirm').hidden = false; return $('[data-pf-delete-no]').focus(); }
    if (d.pfDeleteNo !== undefined) { $('#pfConfirm').hidden = true; return; }
    if (d.pfDeleteYes !== undefined) return deleteProfile();
    if (d.dismiss !== undefined) return hideNotice();
    if (t.id === 'profileBtn') return openProfiles();
    if (t.id === 'favViewBtn') return selectFav();
    if (t.id === 'starFilter') {
      state.listMode = state.listMode === 'fav' ? 'all' : 'fav';
      t.setAttribute('aria-pressed', String(state.listMode === 'fav'));
      renderRail();
      return markCurrent();
    }
    if (t.id === 'themeBtn') {
      const dark = state.theme ? state.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      state.theme = dark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme);
      return save(false);
    }
    if (t.id === 'lbPrev') return stepLightbox(-1);
    if (t.id === 'lbNext') return stepLightbox(1);
  });
  lb.addEventListener('click', e => { if (e.target.classList.contains('lb-backdrop')) closeLightbox(); });

  $('#search').addEventListener('input', e => { state.query = e.target.value; renderRail(); markCurrent(); });
  main.addEventListener('input', e => {
    if (e.target.id === 'cardFilter') { state.cardQuery = e.target.value; refreshCards(); }
    if (e.target.id === 'binderRange') jumpSpread(+e.target.value - 1);
  });
  document.addEventListener('submit', e => {
    if (e.target.matches('[data-pf-new]')) {
      e.preventDefault();
      const input = $('#pfName');
      if (!input.value.trim()) return input.focus();
      createProfile(input.value);
      input.value = '';
    } else if (e.target.matches('[data-pf-rename]')) {
      e.preventDefault();
      renameProfile($('#pfRename').value);
    }
  });
  pf.addEventListener('click', e => { if (e.target.classList.contains('pf-backdrop')) closeProfiles(); });
  main.addEventListener('change', e => {
    if (e.target.id === 'sortSel') { state.sort = e.target.value; save(false); refreshCards(); }
    if (e.target.id === 'binderSort') { state.binderSort = e.target.value; state.spread = 0; save(false); renderFav(); }
    if (e.target.id === 'binderRegion') { state.binderRegion = e.target.value; state.spread = 0; save(false); renderFav(); }
  });
  list.addEventListener('scroll', syncRegionTabs, { passive: true });
  window.addEventListener('scroll', () => { if (narrow.matches) syncRegionTabs(); }, { passive: true });
  narrow.addEventListener('change', () => { markCurrent(); syncRegionTabs(); });

  let swipe = null;
  main.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || !e.target.closest('#spread')) return;
    swipe = { x: e.clientX, y: e.clientY };
  });
  main.addEventListener('pointerup', e => {
    if (!swipe) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 60) flip(dx < 0 ? 1 : -1);
  });

  document.addEventListener('keydown', e => {
    if (!pf.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeProfiles(); }
      return;
    }
    if (!lb.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); return closeLightbox(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); return stepLightbox(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); return stepLightbox(1); }
      if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); return toggleFav(state.lbList[state.lbIndex]); }
      if (e.key === 'Tab') {
        const f = $$('button:not([disabled]), a[href]', $('.lb-panel'));
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
      return;
    }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); $('#search').focus(); return; }
    if (!typing && state.view === 'fav' && state.favView === 'binder' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      e.preventDefault();
      return flip(e.key === 'ArrowRight' ? 1 : -1);
    }
    const item = e.target.closest && e.target.closest('.dex-item');
    if (item && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      const items = $$('.dex-item', list);
      const next = items[items.indexOf(item) + (e.key === 'ArrowDown' ? 1 : -1)];
      if (next) { next.focus(); selectMon(+next.dataset.mon, { open: false, scroll: false }); }
    }
  });

  main.addEventListener('pointermove', e => {
    if (reduceMotion.matches || e.pointerType === 'touch') return;
    const el = e.target.closest('.card-img');
    if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    el.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
    el.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    el.style.setProperty('--rx', ((0.5 - y) * 10).toFixed(2) + 'deg');
    el.style.setProperty('--ry', ((x - 0.5) * 12).toFixed(2) + 'deg');
  });
  main.addEventListener('pointerout', e => {
    const el = e.target.closest('.card-img');
    if (el && !el.contains(e.relatedTarget)) { el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); }
  });
  document.addEventListener('error', e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    if (img.dataset.fallback && img.src !== img.dataset.fallback) { img.src = img.dataset.fallback; img.classList.add('pixel'); return; }
    if (img.classList.contains('sprite')) { img.style.visibility = 'hidden'; return; }
    const box = img.closest('.card-img, .pk-card');
    if (box) box.classList.add('no-img');
    if (box || img.classList.contains('sym')) img.remove();
  }, true);

  window.addEventListener('hashchange', route);
  const topbar = $('#topbar');
  function setTopH() {
    document.documentElement.style.setProperty('--top-h', topbar.offsetHeight + 'px');
    document.documentElement.style.setProperty('--tools-h', $('#railTools').offsetHeight + 'px');
  }
  let resizeFrame = 0, lastMainW = 0;
  function refit() {
    setTopH();
    if ($('#binderWrap') && !binder.animating) {
      const was = binder.two;
      sizeBinder();
      if (was !== binder.two) state.spread = 0;
      drawSpread();
    }
  }
  window.addEventListener('resize', () => { cancelAnimationFrame(resizeFrame); resizeFrame = requestAnimationFrame(refit); });
  // the content area can change width without a window resize event (rotating a phone, zooming), so watch it too
  if (window.ResizeObserver) new ResizeObserver(entries => {
    const w = Math.round(entries[0].contentRect.width);
    if (w === lastMainW) return;
    lastMainW = w;
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(refit);
  }).observe(main);

  /* ---------- boot ---------- */
  const STATS = {
    art: cards.filter(c => !c.promo).length,
    promo: cards.filter(c => c.promo).length,
    first: cards.reduce((m, c) => c.date < m ? c.date : m, '9999'),
    last: cards.reduce((m, c) => c.date > m ? c.date : m, '0000')
  };
  $('#stats').textContent = `${STATS.art.toLocaleString('en-US')} art cards + ${STATS.promo.toLocaleString('en-US')} promos · Pokémon #001–1025 · English sets ${STATS.first.slice(0, 4)} to ${fmtMonth(STATS.last)}`;

  function route() {
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if (h === 'favorites') return selectFav();
    const n = parseInt(h, 10);
    if (n >= 1 && n <= MAX_DEX) return selectMon(n);
    return null;
  }
  $('#regionSel').innerHTML = REGIONS.map(r => `<option value="${r.k}">${r.name} · ${pad3(r.lo)}–${pad3(r.hi)}</option>`).join('');
  $('#regionSel').addEventListener('change', e => jumpTo(e.target.value));
  setTopH();
  loadActive();
  renderProfileBtn();
  renderRail();
  updateFavCount();
  if (!(location.hash && route() !== null)) {
    const start = state.last === 'fav' ? 'fav' : (state.last >= 1 && state.last <= MAX_DEX ? state.last : 6);
    if (start === 'fav') { state.view = 'fav'; renderFav(); }
    else { state.view = start; renderMon(start); }
    markCurrent();
  }
  if (!storageOK) showNotice('nostorage');
  let pickerSeen = false;
  try { pickerSeen = !!sessionStorage.getItem(KEY + ':picker-seen'); } catch (e) { /* treat as first visit */ }
  pullProfiles().then(() => { if (!activeProfile() && !pickerSeen && pf.hidden && lb.hidden) openProfiles(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - cloud.lastPull > 30000) pullProfiles();
  });
  window.addEventListener('online', () => flushQueue());
})();
</script>
</body>
</html>
